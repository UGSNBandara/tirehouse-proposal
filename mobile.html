<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TireHouse Manager Phone Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one working phone plus a list of things to try. Light, white and orange. */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#F3F4F6;color:#1A2129;font:14px/1.45 'Barlow',system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.mw{max-width:1000px;margin:0 auto;display:grid;gap:20px}
h1{margin:0;font:700 34px/1 'Barlow Condensed','Arial Narrow',sans-serif}
.mw p{margin:4px 0 0;color:#5F6B78}
</style>

<body>
<div class="mw"><header><h1>TireHouse manager phone</h1><p>Working demo with sample data. Nothing here is saved or sent anywhere.</p></header>
<div id="phone-host"></div></div>
<template id="phone-tpl"><style>:host{display:block;font:14px/1.45 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;color:#1A2129;text-align:left;
  --bg:#F3F4F6;--surface:#fff;--ink:#1A2129;--muted:#5F6B78;--faint:#8A95A1;--line:#E3E7EC;--line2:#EEF1F4;--wash:#F8F9FB;
  --accent:#D9500A;--accent-d:#B24000;--accent-soft:#FFEDE2;--ok:#15803D;--ok-soft:#E2F5E9;--warn:#92580A;--warn-soft:#FDF1D6;--bad:#B42318;--bad-soft:#FCE4E1;--info:#2F5D9E;--info-soft:#E4EDF9;
  --f-ui:'Barlow',system-ui,sans-serif;--f-num:'Barlow Condensed','Arial Narrow',Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.dn{color:var(--bad)}.wn{color:var(--warn)}.muted{color:var(--muted)}

.pwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:start;position:relative}
.pwrap:fullscreen{background:#E9ECF0;display:grid;grid-template-columns:1fr;place-items:center}
.pwrap.pfs{position:fixed;inset:0;z-index:200;background:#E9ECF0;display:grid;grid-template-columns:1fr;place-items:center}
.pwrap:fullscreen .pside,.pwrap.pfs .pside{display:none}
.pstage{position:relative;display:grid;place-items:center}
.pwrap:fullscreen .device,.pwrap.pfs .device{transform:scale(var(--ps,1))}
.device{width:372px;height:780px;border-radius:48px;background:#E7EAEF;padding:11px;border:1px solid #D3D9E0;box-shadow:0 26px 60px rgba(26,33,41,.2);position:relative;flex:none}
.island{position:absolute;top:21px;left:50%;transform:translateX(-50%);width:92px;height:26px;border-radius:14px;background:#1A2129;z-index:50}
.screen{position:relative;height:100%;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:15px 28px 0;height:50px;font-size:13px;font-weight:700;flex:none}
.sbar span:last-child{display:flex;gap:6px;align-items:center;font-size:11px}
.pbody{flex:1;overflow:auto;padding:6px 16px 96px;scrollbar-width:none}
.pbody::-webkit-scrollbar{display:none}
.hd{display:flex;justify-content:space-between;align-items:center;margin:2px 0 12px}
.hd small{display:block;color:var(--muted);font-size:12px}
.hd h2{margin:0;font:600 30px/1 var(--f-num)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ok);background:var(--ok-soft);border-radius:12px;padding:3px 10px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.8s infinite}
.live.off{color:var(--warn);background:var(--warn-soft)}
@keyframes pulse{50%{opacity:.3}}
.hero{background:linear-gradient(135deg,#E8590C,#FF8A3D);color:#fff;border-radius:22px;padding:16px;margin-bottom:12px}
.hero small{opacity:.92;font-size:13px}
.hero .big{font:700 40px/1.05 var(--f-num);margin:2px 0 4px}
.hero .dl{display:inline-block;background:rgba(255,255,255,.22);border-radius:10px;padding:1px 9px;font-size:12px;font-weight:600}
.hero svg{display:block;width:100%;height:40px;margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}
.tile small{display:block;color:var(--muted);font-size:12px}
.tile b{font:600 24px/1.1 var(--f-num)}
.alert{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid #FFD3B9;border-radius:18px;padding:12px;margin-bottom:12px;width:100%;text-align:left}
.alert .ic{color:var(--accent-d);width:24px;height:24px}
.alert b{display:block}.alert span{font-size:12px;color:var(--muted)}
.alert .chev{margin-left:auto;color:var(--faint)}
.sec{font-size:13px;font-weight:600;margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-weight:500;color:var(--muted);font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.feed .r{display:grid;grid-template-columns:38px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.feed .r:last-child{border-bottom:0}
.feed time{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.feed .r.new{animation:flash 1.8s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.or{background:var(--accent-soft);color:var(--accent-d)}.pill.gray{background:var(--line2);color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#FF8A3D);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.av.b{background:linear-gradient(135deg,#2F5D9E,#5B8AD0)}
.arow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.arow b{display:block;font-size:14px;line-height:1.25}.arow span.s{font-size:12px;color:var(--muted)}
.arow .chev{color:var(--faint)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13px}.empty b{display:block;color:var(--ink);font-size:14px}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent-d);font-weight:600;padding:2px 0;margin-bottom:8px}
.big2{font:700 44px/1 var(--f-num);margin:8px 0 2px}
.kv{background:#fff;border:1px solid var(--line);border-radius:18px;padding:4px 14px;margin:12px 0}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
.kv div:last-child{border-bottom:0}
.kv span{color:var(--muted)}.kv b{font-variant-numeric:tabular-nums;text-align:right}
.photo{height:90px;border-radius:14px;background:repeating-linear-gradient(45deg,#EEF1F4,#EEF1F4 10px,#E5E9EE 10px,#E5E9EE 20px);display:grid;place-items:center;color:var(--muted);font-size:12px;margin-bottom:10px}
.actbar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1.6fr;gap:10px;padding:12px 16px 22px;background:linear-gradient(180deg,rgba(243,244,246,0),var(--bg) 24%)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;font-weight:700;font-size:15px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#F0BDB7}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:0 12px;margin-bottom:10px;color:var(--muted)}
.search input{border:0;outline:0;background:none;padding:11px 0;width:100%;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:#FFD3B9;color:var(--accent-d)}
.qty{font:700 20px/1 var(--f-num);border-radius:10px;padding:3px 10px}
.qty.ok{background:var(--ok-soft);color:var(--ok)}.qty.bad{background:var(--bad-soft);color:var(--bad)}.qty.warn{background:var(--warn-soft);color:var(--warn)}.qty.gray{background:var(--line2);color:var(--muted)}
.meter{height:7px;border-radius:4px;background:var(--line2);overflow:hidden}.meter i{display:block;height:100%;border-radius:4px}
.bars{display:flex;align-items:flex-end;gap:10px;height:96px;padding-top:6px}
.bars div{flex:1;display:grid;gap:4px;align-content:end;justify-items:center;height:100%;font-size:11px;color:var(--muted)}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:2px}
.bars div.cur i{background:var(--accent)}.bars div:not(.cur) i{background:#F4B895}
.ptabs{position:absolute;left:12px;right:12px;bottom:14px;display:flex;justify-content:space-around;background:#fff;border:1px solid var(--line);border-radius:26px;padding:8px 4px;box-shadow:0 8px 24px rgba(26,33,41,.12);z-index:20}
.ptabs button{border:0;background:none;display:grid;justify-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--muted);padding:2px 10px;position:relative}
.ptabs button.on{color:var(--accent-d)}
.ptabs .bd{position:absolute;top:-4px;right:2px;background:var(--accent);color:#fff;border-radius:9px;font-size:10px;font-weight:700;min-width:17px;line-height:17px;text-align:center}
.banner{position:absolute;top:52px;left:10px;right:10px;z-index:45;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:20px;padding:10px 12px;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;box-shadow:0 14px 34px rgba(26,33,41,.22);text-align:left;width:calc(100% - 20px);animation:drop .25s ease-out}
@keyframes drop{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}
.banner .ico,.notif .ico{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#E8590C,#FF8A3D);display:grid;place-items:center;color:#fff}
.banner .ico .ic,.notif .ico .ic{width:18px;height:18px}
.banner b{display:block;font-size:13px}.banner span{font-size:12px;color:var(--muted)}
.sback{position:absolute;inset:0;background:rgba(26,33,41,.4);z-index:50}
.sbox{position:absolute;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:28px 28px 0 0;padding:20px 20px 28px;animation:rise .22s ease-out;max-height:92%;overflow:auto}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sbox h3{margin:0 0 4px;font:600 26px/1.1 var(--f-num)}
.sbox .lead{color:var(--muted);font-size:13px;margin:0 0 14px}
.fp{width:92px;height:92px;border-radius:50%;margin:10px auto 8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-d);border:0}
.fp .ic{width:48px;height:48px}
.fp.scan{animation:ring 0.8s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 14px rgba(217,80,10,.16)}}
.fp.good{background:var(--ok-soft);color:var(--ok)}
.fp.badf{background:var(--bad-soft);color:var(--bad)}
.center{text-align:center}
.link{border:0;background:none;color:var(--accent-d);font-weight:700;padding:8px}
.dots{display:flex;gap:12px;justify-content:center;margin:12px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:block}
.dots i.f{background:var(--accent)}
.dots.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{border:1px solid var(--line);background:var(--wash);border-radius:16px;padding:12px 0;font:600 24px var(--f-num)}
.keys button:active{background:var(--accent-soft)}
.reasons{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.plock{position:absolute;inset:0;z-index:55;background:linear-gradient(180deg,#FFE3CF 0%,#FFF6EF 52%,#F3F4F6 100%);padding:60px 14px 18px;display:flex;flex-direction:column;gap:9px}
.plock .time{font:700 70px/1 var(--f-num);text-align:center;margin-top:8px}
.plock .date{text-align:center;color:var(--muted);font-size:13px;margin-bottom:8px}
.notif{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;background:rgba(255,255,255,.93);border:1px solid #fff;border-radius:18px;padding:10px 12px;font-size:12px;color:var(--muted);text-align:left;width:100%;box-shadow:0 6px 18px rgba(26,33,41,.08)}
.notif b{display:block;color:var(--ink);font-size:13px}
.sms{background:#fff;border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 12px;font-size:12px;box-shadow:0 6px 18px rgba(26,33,41,.08)}
.sms small{display:block;color:var(--muted);margin-bottom:2px}
.plock .unl{margin-top:auto}
.ptoast{position:absolute;left:24px;right:24px;bottom:92px;z-index:60;background:var(--ink);color:#fff;border-radius:16px;padding:10px 14px;font-size:13px;text-align:center;animation:drop .2s ease-out}
.enl{position:absolute;right:-6px;bottom:6px;z-index:5;width:42px;height:42px;border-radius:12px;border:0;background:rgba(26,33,41,.82);color:#fff;display:grid;place-items:center;opacity:.65;transition:opacity .15s,transform .15s}
.enl:hover,.enl:focus-visible{opacity:1;transform:scale(1.07)}
.pwrap:fullscreen .enl,.pwrap.pfs .enl{position:fixed;right:22px;bottom:22px}
.pside{display:grid;gap:14px;align-content:start;max-width:520px}
.pside h3{margin:0;font:600 28px/1.05 var(--f-num)}
.pside p{margin:0;color:var(--muted)}
.try{display:grid;gap:8px}
.try .b{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-weight:600}
.try .b:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.try .b small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.try .b .ic{color:var(--accent-d);width:22px;height:22px}
.tip{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--accent-d)}
@media (max-width:900px){.pwrap{grid-template-columns:1fr;justify-items:center}.pside{max-width:none;width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><div class="pwrap" id="pwrap">

        <nav class="ptabs" id="ptabs" aria-label="Phone tabs"></nav>
        <div id="pbanner"></div>
        <div id="psheet" hidden></div>

    <button class="enl" data-a="pfs" id="pfsBtn" aria-label="Full screen" title="Full screen"></button>
  </div>
  <aside class="pside" id="pside"></aside>
</div>
</template>

/* ---------- helpers ---------- */
var item=function(id){return S.items.filter(function(i){return i.id===id})[0]};
var cust=function(id){return S.customers.filter(function(c){return c.id===id})[0]};
var sup=function(id){return S.suppliers.filter(function(c){return c.id===id})[0]};
var me=function(){return S.members.filter(function(m){return m.id===S.user})[0]};
var isMgr=function(){return S.user==='m0'};
var can=function(k){return isMgr()||!!me().perms[k]};
var sum=function(a){return a.reduce(function(s,v){return s+v},0)};
var bal=function(c){return sum(c.buckets)};
var sub=function(i){return sum(i.lines.map(function(l){return l.qty*l.price}))};
var dsc=function(i){return Math.round(sub(i)*(i.disc||0)/100)};
var tot=function(i){return sub(i)-dsc(i)};
var counted=function(i){return i.status==='paid'||i.status==='credit'};
var invByNo=function(no){return S.invoices.filter(function(i){return i.no===no})[0]};
var cashNow=function(){return sum(S.ledger.map(function(e){return e.inn-e.out}))};
var pending=function(){return S.approvals.filter(function(a){return a.status==='pending'})};
var logAdd=function(k,text){S.log.unshift({t:hm(now()),k:k,text:text,fresh:true})};
var ledgerAdd=function(desc,inn,out){S.ledger.push({t:hm(now()),desc:desc,inn:inn||0,out:out||0})};
function moveAdd(id,text,q){(S.moves[id]=S.moves[id]||[]).unshift({t:hm(now()),text:text,q:q})}
function smsAdd(to,kind,text){S.sms.unshift({t:hm(now()),to:to,kind:kind,text:text})}
function summary(i){var f=item(i.lines[0].id);return f.name+(i.lines.length>1?' +'+(i.lines.length-1)+' more':'')}
function pill(st){var m={paid:['ok','Paid'],credit:['info','On credit'],held:['warn','Waiting for manager'],void:['gray','Voided'],rejected:['bad','Rejected'],pending:['warn','Pending'],approved:['ok','Approved']};var x=m[st]||['gray',st];return '<span class="pill '+x[0]+'">'+x[1]+'</span>'}
function ydayAt(m){var ys=[[480,0],[510,21000],[540,55000],[570,98000],[600,132000],[642,164500],[660,180000],[690,205000],[720,233000]];if(m<=480)return 0;for(var i=1;i<ys.length;i++){if(m<=ys[i][0]){var a=ys[i-1],b=ys[i];return a[1]+(b[1]-a[1])*(m-a[0])/(b[0]-a[0])}}return 233000}
function addRecv(c,amt){c.buckets[0]+=amt}
function payRecv(c,amt){var rem=amt;for(var i=3;i>=0&&rem>0;i--){var t=Math.min(c.buckets[i],rem);c.buckets[i]-=t;rem-=t}}
function toast(text,kind,title){if(!$('#toasts'))return;var el=document.createElement('div');el.className='toast '+(kind||'');var ic=kind==='push'?'phone':kind==='bad'?'alert':kind==='warn'?'alert':'check';el.innerHTML=ICON(ic)+'<div>'+(title?'<b>'+esc(title)+'</b>':'')+esc(text)+'</div>';$('#toasts').appendChild(el);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},4200)}

/* ---------- invoice engine ---------- */
function stockShort(i){var out=[];i.lines.forEach(function(l){var it=item(l.id);if(it.stock!=null&&it.stock<l.qty)out.push(it.name)});return out}
function completeInvoice(i,approved){
  var short=stockShort(i);
  if(short.length){toast('Not enough stock for '+short.join(', '),'bad');return false}
  i.lines.forEach(function(l){var it=item(l.id);if(it.stock!=null){it.stock-=l.qty;moveAdd(it.id,'Sold on '+i.no,-l.qty)}});
  var c=cust(i.cust),t=tot(i);
  if(i.method==='credit'){i.status='credit';addRecv(c,t)}
  else{i.status='paid';if(i.method==='cash')ledgerAdd('Sale '+i.no,t,0)}
  i.time=hm(now());
  if(!S.online){i.queued=true;S.queued++}
  logAdd('sale','Invoice '+i.no+' · '+summary(i)+' · '+fmt(t));
  if(i.sms&&c.phone){smsAdd(c.phone,'Receipt','TireHouse: Thank you. '+i.no+' '+rs(t)+(i.method==='credit'?' on credit':' paid by '+i.method)+'. Keep this message as your receipt.')}
  return true;
}
function voidInvoice(i){
  i.lines.forEach(function(l){var it=item(l.id);if(it.stock!=null){it.stock+=l.qty;moveAdd(it.id,'Returned from voided '+i.no,l.qty)}});
  var t=tot(i);
  if(i.status==='credit'){payRecv(cust(i.cust),t)}else if(i.method==='cash'){ledgerAdd('Void '+i.no,0,t)}
  i.status='void';logAdd('sale','Invoice '+i.no+' voided');
}
function applyAdjust(id,delta,reason){var it=item(id);it.stock=Math.max(0,it.stock+delta);moveAdd(id,'Adjustment · '+reason,delta);logAdd('stock','Stock adjusted '+(delta>0?'+':'')+delta+' · '+it.name+' · '+reason)}
function newRequest(o){
  S.apprSeq++;o.id='A'+S.apprSeq;o.t=hm(now());o.status='pending';if(o.exp===undefined)o.exp=o.type==='adjust'?null:hm(new Date(now().getTime()+30*60000));S.approvals.unshift(o);
  logAdd('appr',o.by+' asked: '+o.title);
  if(!S.online)smsAdd('0771 000 111','Approval code','TireHouse approval code 482 913 for '+o.title+'. Valid 30 min.');
  if(S.online)toast(o.title,'push','Sent to the Manager\'s phone');else toast('Saved on this PC. It goes to the Manager when the internet is back.','warn');
}
function decide(id,ok){
  var a=S.approvals.filter(function(x){return x.id===id})[0];if(!a||a.status!=='pending')return;
  if(ok){
    if(a.type==='sale'){var i=invByNo(a.inv);if(!completeInvoice(i,true))return}
    else if(a.type==='adjust'){applyAdjust(a.item,a.delta,a.reason)}
    else if(a.type==='void'){voidInvoice(invByNo(a.inv))}
    a.status='approved';toast(a.title,'ok','Approved');
  }else{
    a.status='rejected';if(a.type==='sale'){var j=invByNo(a.inv);if(j)j.status='rejected'}toast(a.title,'warn','Rejected');
  }
  a.by2='Manager';a.dt=hm(now());logAdd('appr',(ok?'Approved: ':'Rejected: ')+a.title);render();
}

function cartInv(){var c=S.cart;return {lines:c.lines.map(function(l){return {id:l.id,qty:l.qty,price:item(l.id).price}}),disc:c.disc}}
function reasons(){
  var r=[];if(isMgr())return r;var c=S.cart,t=tot(cartInv()),k=cust(c.cust);
  if(c.disc>0&&!(can('disc')&&c.disc<=DISC_LIMIT))r.push({type:'discount',text:'Discount '+c.disc+'% is above your limit',title:'Discount '+c.disc+'%'});
  if(c.method==='credit'){var av=k.limit-bal(k);if(t>av)r.push({type:'credit',text:'This credit sale is over the limit by '+rs(t-av),title:'Credit sale '+rs(t)+' · '+k.name})}
  if(!can('pay'))r.push({type:'payment',text:'You cannot take payments, so the Manager collects',title:'Collect payment '+rs(t)});
  return r;
}
function charge(){
  var c=S.cart;if(!c.lines.length)return;
  var i={no:'INV-'+S.invSeq,time:hm(now()),cust:c.cust,veh:c.veh,lines:cartInv().lines,disc:c.disc,method:c.method,status:'held',by:isMgr()?'Manager':me().name,sms:c.sms};
  var short=stockShort(i);if(short.length){toast('Not enough stock for '+short.join(', '),'bad');return}
  var r=reasons();S.invSeq++;S.invoices.unshift(i);
  if(r.length){
    var k=cust(c.cust);
    newRequest({type:'sale',title:r[0].title+' on '+i.no,by:me().name,detail:r.map(function(x){return x.text}).join('. ')+' · '+k.name+' · '+rs(tot(i)),inv:i.no});
    S.cart=freshCart();render();return;
  }
  completeInvoice(i);S.cart=freshCart();render();openReceipt(i.no,true);
}

  var sales=S.invoices.filter(counted).sort(function(a,b){return mins(a.time)-mins(b.time)});
  var c=0,pts=[[x0,0]];sales.forEach(function(i){c+=tot(i);pts.push([mins(i.time),c])});pts.push([Math.max(nowM,pts[pts.length-1][0]),c]);
  var ys=[[480,0],[510,21000],[540,55000],[570,98000],[600,132000],[642,164500],[660,180000],[690,205000],[720,233000]];
  var yMax=Math.ceil(Math.max(c,233000)/50000)*50000;
  var X=function(m){return L+(Math.min(m,x1)-x0)/(x1-x0)*pw},Y=function(v){return T+ph-v/yMax*ph};
  var P=function(a){return a.map(function(p){return X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)}).join(' ')};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Sales so far today compared with yesterday">';

    '<div class="grid2e" style="margin-top:16px"><div class="card"><h3>Delivery</h3><div class="form"><label class="fld">Supplier delivery note number<input class="in" id="dn" data-in="dn" value="'+esc(g.dn)+'" placeholder="Optional"></label><label class="chk"><input type="checkbox" data-ch="photo"'+(g.photo?' checked':'')+'>Photo of the delivery note attached</label></div></div><div class="card"><h3>Check summary</h3><div class="kv" style="margin:0"><div><span class="muted">Lines matched</span><b>'+matched+' of '+po.lines.length+'</b></div><div><span class="muted">Units received</span><b>'+units+'</b></div>'+(cost?'<div><span class="muted">Value added to stock</span><b>'+rs(val)+'</b></div>':'')+'</div>'+(short?'<div class="note warn" style="margin-top:10px">'+short+' units short. A note about the shortage is saved with this GRN.</div>':'<div class="note ok" style="margin-top:10px">Everything matches the order.</div>')+'<button class="btn pri big" style="margin-top:12px" data-act="postgrn">Post GRN and add to stock</button></div></div>';
  }else form='<div class="card"><div class="empty"><b>Pick an order</b>Choose a purchase order on the left, then enter what actually arrived.</div></div>';
  var hist=S.grns.slice(0,5).map(function(x){return '<tr><td style="white-space:nowrap"><b>'+x.no+'</b><span class="sub">'+x.t+'</span></td><td>'+esc(sup(x.sup).name)+'</td><td class="n">'+x.units+'</td><td>'+(x.short?'<span class="pill warn">'+x.short+' short</span>':'<span class="pill ok">Complete</span>')+'</td></tr>'}).join('');
  return '<div class="ph"><div><h2>Goods received</h2><p>Check a delivery against its order, then post it to stock</p></div></div><div style="display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start"><div class="stack"><div class="stack">'+cards+'</div><div class="card flush"><h3 style="padding:14px 16px 0">Posted today</h3><table><tbody>'+hist+'</tbody></table></div></div><div>'+form+'</div></div>';
}

/* ---------- modals ---------- */
function modal(html,wide){$('#modal').innerHTML='<div class="mback" data-act="closeModal"></div><div class="mbox'+(wide?' wide':'')+'" role="dialog" aria-modal="true">'+html+'</div>';$('#modal').hidden=false;var f=$('#modal input,#modal select');if(f)f.focus()}
function closeModal(){var m=$('#modal');if(!m)return;m.hidden=true;m.innerHTML=''}
function closeDrawer(){var m=$('#drawer');if(!m)return;m.hidden=true;m.innerHTML=''}
var val=function(id){var e=ROOT.getElementById(id);return e?e.value:''};
var numv=function(id){var v=parseFloat(val(id));return isFinite(v)?v:0};

/* ---------- actions ---------- */
var A={
  go:function(t){closeDrawer();go(t.dataset.v)},

    S.invoices.unshift(i);completeInvoice(i);render();toast(i.no+' · '+q+' × '+it.name+' · '+rs(tot(i)),'ok','Counter 1 just sold');
  },

  closeDrawer:function(){closeDrawer()},

  inv:function(t){openReceipt(t.dataset.id,false)},

  adjust:function(t){var id=t.dataset.id,d=Math.round(numv('adj')),r=val('adjr'),it=item(id);if(!d){toast('Enter how many to add or remove.','warn');return}

  newItem:function(){modal('<h3>Add item</h3><p class="lead">New items start with the opening stock you enter.</p><div class="form"><label class="fld">Name<input class="in" id="ni-name" placeholder="Kestrel Comfort"></label><div class="two"><label class="fld">Type<select class="in" id="ni-type"><option value="tyre">Tyre</option><option value="battery">Battery</option><option value="oil">Oil</option></select></label><label class="fld">Detail<input class="in" id="ni-spec" placeholder="205/55R16 · 91V"></label></div><div class="two"><label class="fld">Opening stock<input class="in num-in" id="ni-stock" type="number" min="0" value="0"></label><label class="fld">Reorder level<input class="in num-in" id="ni-re" type="number" min="0" value="4"></label></div><div class="two"><label class="fld">Cost price<input class="in num-in" id="ni-cost" type="number" min="0"></label><label class="fld">Selling price<input class="in num-in" id="ni-price" type="number" min="0"></label></div></div><div class="mact"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="saveItem">Save item</button></div>')},

    S.items.push({id:'n'+Date.now(),sku:pre+'-'+Math.floor(1000+Math.random()*8999),name:n,type:ty,spec:val('ni-spec')||'—',stock:Math.max(0,Math.round(numv('ni-stock'))),reorder:Math.round(numv('ni-re')),cost:Math.round(numv('ni-cost')),price:p,unit:ty==='oil'?'pack':'pc'});
    logAdd('stock','New item added · '+n);closeModal();render();toast(n,'ok','Item added')},

  var s=S(),sold=s.invoices.filter(T.counted),today=sold.reduce(function(x,i){return x+T.tot(i)},0),nowH=Math.floor(T.mins(T.hm(T.now()))/60);
  var hrs=[];for(var h=8;h<=Math.max(10,nowH);h++)hrs.push(h);
  var byH={};sold.forEach(function(i){var k=Math.floor(T.mins(i.time)/60);byH[k]=(byH[k]||0)+T.tot(i)});
  var mxH=Math.max.apply(null,hrs.map(function(k){return byH[k]||0}))||1;
  var bars=hrs.map(function(k){return '<div'+(k===nowH?' class="cur"':'')+'><i style="height:'+Math.max(3,Math.round((byH[k]||0)/mxH*70))+'px"></i><span>'+k+'h</span></div>'}).join('');
  var cat={tyre:0,battery:0,oil:0,service:0},top={};sold.forEach(function(i){i.lines.forEach(function(l){var it=T.item(l.id);cat[it.type]+=l.qty*l.price*(1-(i.disc||0)/100);top[it.name]=(top[it.name]||0)+l.qty})});
  var ct=Object.keys(cat).reduce(function(x,k){return x+cat[k]},0)||1;
  var catH=Object.keys(cat).map(function(k){var p=Math.round(cat[k]/ct*100);return '<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>'+({tyre:'Tyres',battery:'Batteries',oil:'Oil',service:'Services'})[k]+'</span><b>'+p+'%</b></div><div class="meter"><i style="width:'+p+'%;background:'+T.TYPE[k].c+'"></i></div></div>'}).join('');
  var topH=Object.keys(top).sort(function(a,b){return top[b]-top[a]}).slice(0,4).map(function(n){return '<div class="r" style="grid-template-columns:1fr auto"><span>'+esc(n)+'</span><b>'+top[n]+' sold</b></div>'}).join('');
  var tb=[0,0,0,0];s.customers.forEach(function(c){c.buckets.forEach(function(v,i){tb[i]+=v})});var owe=tb.reduce(function(x,v){return x+v},0),tt=owe||1,cols=['#D9500A','#E9893F','#E0A21B','#B42318'];
  var inn=s.ledger.reduce(function(x,e){return x+e.inn},0),out=s.ledger.reduce(function(x,e){return x+e.out},0);
  var sms=s.sms.reduce(function(x,m){return x+Math.max(1,Math.ceil(m.text.length/160))},0);
  return '<div class="hd"><div><small>Today so far</small><h2>Reports</h2></div></div><div class="card"><small class="muted">Sales</small><div class="big2 num" style="margin:2px 0">'+rs(today)+'</div><div class="bars">'+bars+'</div></div>'+
  '<div class="sec">By category</div><div class="card">'+catH+'</div><div class="sec">Top sellers</div><div class="card feed">'+(topH||'<div class="empty">No sales yet.</div>')+'</div>'+
  '<div class="sec">Customers owe<small>'+rs(owe)+'</small></div><div class="card"><div style="display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px">'+tb.map(function(v,i){return '<i style="display:block;width:'+(v/tt*100)+'%;background:'+cols[i]+'"></i>'}).join('')+'</div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px"><span>0–30 d</span><span>31–60</span><span>61–90</span><span>90+</span></div></div>'+
  '<div class="sec">Cash book</div><div class="kv"><div><span>Opening</span><b>40,000</b></div><div><span>Money in</span><b class="up">+'+fmt(inn-40000)+'</b></div><div><span>Money out</span><b class="dn">−'+fmt(out)+'</b></div><div><span>In the drawer</span><b>'+fmt(T.cashNow())+'</b></div></div>'+
  '<div class="sec">SMS sent today<small>billed by count</small></div><div class="card"><b class="num" style="font-size:26px">'+sms+'</b> <span class="muted">messages</span></div>';
}

/* ---------- sheets ---------- */
function sheetHTML(){
  var sh=st.sheet;if(!sh)return '';
  var a=sh.id?find(sh.id):null,body='';
  if(sh.type==='bio'){
    var ph=sh.phase||'ask';
    body='<h3>'+(ph==='ok'?'Approved':ph==='fail'?'Could not approve':'Approve with fingerprint')+'</h3><p class="lead">'+esc(a?a.title:'')+'</p>'+
      '<div class="center"><button class="fp'+(ph==='scan'?' scan':ph==='ok'?' good':ph==='fail'?' badf':'')+'" data-a="touch" aria-label="Touch sensor"'+(ph==='scan'||ph==='ok'?' disabled':'')+'>'+IC(ph==='ok'?'check':ph==='fail'?'alert':'finger')+'</button><div class="muted">'+(ph==='scan'?'Checking…':ph==='ok'?'The counter is unlocked.':ph==='fail'?esc(sh.msg||'Something went wrong.'):'Touch the sensor. In this demo, click the fingerprint.')+'</div>'+(ph==='ask'?'<button class="link" data-a="usepin">Use PIN instead</button>':'')+'</div>';
  }else if(sh.type==='pin'){
    var d=sh.pin||'';
    body='<h3>Enter your PIN</h3><p class="lead">Demo PIN is 1234.</p><div class="dots'+(sh.bad?' shake':'')+'">'+[0,1,2,3].map(function(i){return '<i class="'+(i<d.length?'f':'')+'"></i>'}).join('')+'</div>'+(sh.bad?'<div class="center dn" style="margin-bottom:8px">Wrong PIN. Try again.</div>':'')+'<div class="keys">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-a="key" data-v="'+n+'">'+n+'</button>'}).join('')+'<button data-a="sheetclose" style="font-size:14px">Cancel</button><button data-a="key" data-v="0">0</button><button data-a="del" aria-label="Delete">⌫</button></div>';
  }else if(sh.type==='rej'){
    var rr=['Not enough margin','Ask me later','Check with the customer'];
    body='<h3>Reject this request?</h3><p class="lead">'+esc(a?a.title:'')+'</p><div class="reasons">'+rr.map(function(x){return '<button class="chip'+(sh.reason===x?' on':'')+'" data-a="reason" data-v="'+x+'">'+x+'</button>'}).join('')+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn" data-a="sheetclose">Keep it</button><button class="btn bad" data-a="rejgo" data-id="'+sh.id+'">Reject</button></div>';
  }else if(sh.type==='item'){
    var it=T.item(sh.id),pos=S().pos.filter(function(p){return p.status==='open'&&p.lines.some(function(l){return l.id===it.id})}),mv=(S().moves[it.id]||[]).slice(0,4);
    body='<h3>'+esc(it.name)+'</h3><p class="lead">'+esc(it.spec)+'</p><div class="kv" style="margin-top:0"><div><span>On hand</span><b>'+fmt(it.stock)+' '+it.unit+'</b></div><div><span>Reorder level</span><b>'+fmt(it.reorder)+'</b></div><div><span>Cost</span><b>'+fmt(it.cost)+'</b></div><div><span>Selling price</span><b>'+fmt(it.price)+'</b></div><div><span>Margin</span><b>'+Math.round((it.price-it.cost)/it.price*100)+'%</b></div>'+pos.map(function(p){var l=p.lines.filter(function(x){return x.id===it.id})[0];return '<div><span>On order '+p.no+'</span><b>'+l.ord+'</b></div>'}).join('')+'</div>'+(mv.length?'<div class="sec" style="margin-top:0">Recent movement</div><div class="card feed">'+mv.map(function(m){return '<div class="r" style="grid-template-columns:1fr auto"><span>'+esc(m.text)+'</span><b class="'+(m.q<0?'dn':'up')+'">'+(m.q>0?'+':'')+m.q+'</b></div>'}).join('')+'</div>':'')+'<button class="btn" data-a="sheetclose" style="width:100%">Close</button>';
  }
  return '<div class="sback" data-a="sheetclose"></div><div class="sbox" role="dialog" aria-modal="true">'+body+'</div>';
}

/* ---------- drawing ---------- */
function drawOverlays(){
  var b=st.banner,pb=$('#pbanner');
  pb.innerHTML=b&&!st.lock?'<button class="banner" data-a="bopen" data-id="'+b.id+'"><span class="ico">'+IC(b.sms?'msg':'bell')+'</span><div><b>'+esc(b.sms?b.title:'Approval needed')+'</b><span>'+esc(b.sms?b.sub:b.title)+'</span></div></button>':'';
  var sh=$('#psheet');sh.hidden=!st.sheet;sh.innerHTML=sheetHTML();
  var tt=$('#ptoast');tt.hidden=!st.toast;tt.textContent=st.toast||'';
  var lk=$('#plock');lk.hidden=!st.lock;
  if(st.lock){
    var d=T.now(),days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],mo=['January','February','March','April','May','June','July','August','September','October','November','December'];
    var nots=st.notifs.slice(0,3).map(function(n){return '<button class="notif" data-a="lopen" data-id="'+n.id+'"><span class="ico">'+IC(n.sms?'msg':'bell')+'</span><div><b>'+esc(n.sms?n.title:'TireHouse · Approval needed')+'</b>'+esc(n.sub&&!n.sms?n.title:n.sub)+'</div></button>'}).join('');
    var low=S().items.filter(function(i){return i.stock!=null&&i.stock<=i.reorder&&i.type!=='service'})[0];
    lk.innerHTML='<div class="time">'+T.hm(d)+'</div><div class="date">'+days[d.getDay()]+' '+d.getDate()+' '+mo[d.getMonth()]+'</div>'+(nots||'')+
      (low?'<div class="notif" style="grid-template-columns:34px 1fr"><span class="ico">'+IC('box')+'</span><div><b>TireHouse · Low stock</b>'+esc(low.name)+': '+low.stock+' left, reorder at '+low.reorder+'.</div></div>':'')+
      (S().online?'':'<div class="sms"><small>SMS fallback, no internet</small>TireHouse approval code 482 913. Valid 30 min.</div>')+'<button class="btn pri unl" data-a="unlock">'+IC('lock')+'Unlock</button>';
  }
}
function draw(){
  var s=S(),body=$('#pbody'),ae=R.activeElement,fid=ae&&ae.id,ss=null;
  if(ae&&typeof ae.selectionStart==='number'){try{ss=ae.selectionStart}catch(e){}}
  var key=st.tab+'|'+st.detail,sc=body.scrollTop;
  $('#sbar').innerHTML='<span>'+T.hm(T.now())+'</span><span>'+(s.online?'5G ':'No signal ')+'▮▮▮</span>';
  var html=st.detail?detailView():st.tab==='appr'?apprView():st.tab==='stock'?stockView():st.tab==='rep'?repView():liveView();
  body.innerHTML=html;body.scrollTop=key===st.lastKey?sc:0;st.lastKey=key;
  var n=pend().length,tabs=$('#ptabs');tabs.hidden=!!st.detail;
  tabs.innerHTML=[['live','Live','home'],['appr','Approvals','check'],['stock','Stock','box'],['rep','Reports','chart']].map(function(x){return '<button data-a="tab" data-v="'+x[0]+'" class="'+(st.tab===x[0]?'on':'')+'">'+IC(x[2])+x[1]+(x[0]==='appr'&&n?'<span class="bd">'+n+'</span>':'')+'</button>'}).join('');
  drawOverlays();drawSide();
  if(fid){var el=R.getElementById(fid);if(el&&el!==R.activeElement){el.focus();if(ss!=null&&el.setSelectionRange){try{el.setSelectionRange(ss,ss)}catch(e){}}}}
}
function drawSide(){
  var on=S().online;
  $('#pside').innerHTML='<div><h3>Make something happen</h3><p>'+(standalone?'There is no counter on this page, so these buttons play the part of the shop.':'This phone is connected to the desktop demo above. Act as Nimal there, or use these buttons.')+'</p></div>'+
  '<div class="try">'+
  '<button class="b" data-a="s-disc">'+IC('receipt')+'<span>Staff asks for a discount<small>A request arrives and the phone alerts you</small></span></button>'+
  '<button class="b" data-a="s-adj">'+IC('box')+'<span>Staff asks to write off stock<small>Kamal reports damaged tyres or oil</small></span></button>'+
  '<button class="b" data-a="s-cred">'+IC('wallet')+'<span>Credit sale over the limit<small>Needs your decision before it goes through</small></span></button>'+
  '<button class="b" data-a="s-sim">'+IC('phone')+'<span>Another counter sells<small>Watch the live numbers move</small></span></button>'+
  '<button class="b" data-a="s-net">'+IC('wifi')+'<span>'+(on?'Cut the internet':'Bring the internet back')+'<small>'+(on?'New requests arrive as an SMS code instead':'Alerts return to normal push')+'</small></span></button>'+
  '<button class="b" data-a="lock">'+IC('lock')+'<span>Show the lock screen<small>See how alerts look when the phone is locked</small></span></button>'+
  '<button class="b" data-a="s-reset">'+IC('reset')+'<span>Reset the demo<small>Back to the sample data</small></span></button></div>'+
  '<div class="tip">Approving asks for a fingerprint or PIN, just like the real app. Demo PIN: 1234.</div>';
}

/* ---------- full screen ---------- */
function isFS(){return !!document.fullscreenElement||$('#pwrap').classList.contains('pfs')}
function fit(){var w=$('#pwrap');if(isFS()){var s=Math.max(.7,Math.min(1.9,(window.innerHeight-48)/812));w.style.setProperty('--ps',s.toFixed(3))}else w.style.removeProperty('--ps');var on=isFS(),b=$('#pfsBtn');b.innerHTML=IC(on?'compress':'expand');b.setAttribute('aria-label',on?'Exit full screen':'Full screen');b.title=on?'Exit full screen (Esc)':'Full screen'}
function setPfs(on){$('#pwrap').classList.toggle('pfs',on);document.documentElement.style.overflow=on?'hidden':'';fit()}
function toggleFS(){
  var w=$('#pwrap');
  if(isFS()){setPfs(false);if(document.fullscreenElement){try{document.exitFullscreen()}catch(e){}}fit();return}
  var p;try{p=w.requestFullscreen?w.requestFullscreen():null}catch(e){p=null}
  if(p&&p.then){p.then(fit,function(){setPfs(true)})}else setPfs(true);
}
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement)document.documentElement.style.overflow='';fit()});
window.addEventListener('resize',fit);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#pwrap').classList.contains('pfs')){setPfs(false)}});

/* ---------- actions ---------- */
function startApprove(id){st.sheet={type:'bio',id:id,phase:'ask'};drawOverlays()}
function finishApprove(){
  var id=st.sheet&&st.sheet.id;if(!id)return;
  T.decide(id,true);var a=find(id);
  if(a&&a.status==='approved'){st.sheet={type:'bio',id:id,phase:'ok'};drawOverlays();setTimeout(function(){st.sheet=null;st.detail=null;draw()},1500)}
  else{st.sheet={type:'bio',id:id,phase:'fail',msg:'Not enough stock to complete this bill.'};drawOverlays()}
}
var AC={
  tab:function(t){st.tab=t.dataset.v;st.detail=null;draw()},
  open:function(t){st.detail=t.dataset.id;draw()},
  back:function(){st.detail=null;draw()},
  appr:function(t){startApprove(t.dataset.id)},
  rej:function(t){st.sheet={type:'rej',id:t.dataset.id,reason:''};drawOverlays()},
  reason:function(t){st.sheet.reason=t.dataset.v;drawOverlays()},
  rejgo:function(t){var id=t.dataset.id;T.decide(id,false);st.sheet=null;st.detail=null;draw();ptoast('Rejected. The counter was told.')},
  sheetclose:function(){st.sheet=null;drawOverlays()},
  touch:function(){if(!st.sheet||st.sheet.phase==='scan')return;st.sheet.phase='scan';drawOverlays();setTimeout(finishApprove,800)},
  usepin:function(){st.sheet={type:'pin',id:st.sheet.id,pin:''};drawOverlays()},
  key:function(t){var sh=st.sheet;if(!sh||sh.type!=='pin')return;sh.bad=false;sh.pin=(sh.pin||'')+t.dataset.v;if(sh.pin.length>=4){if(sh.pin==='1234'){var id=sh.id;st.sheet={type:'bio',id:id,phase:'scan'};drawOverlays();setTimeout(finishApprove,700)}else{sh.bad=true;drawOverlays();setTimeout(function(){if(st.sheet&&st.sheet.type==='pin'){st.sheet.pin='';st.sheet.bad=false;drawOverlays()}},700)}}else drawOverlays()},
  del:function(){var sh=st.sheet;if(sh&&sh.pin){sh.pin=sh.pin.slice(0,-1);drawOverlays()}},
  item:function(t){st.sheet={type:'item',id:t.dataset.id};drawOverlays()},
  tf:function(t){st.tf=t.dataset.v;draw()},
  bopen:function(t){st.banner=null;st.tab='appr';st.detail=t.dataset.id;draw()},
  lopen:function(t){st.lock=false;st.tab='appr';st.detail=t.dataset.id;draw()},
  lock:function(){st.lock=true;drawOverlays()},
  unlock:function(){st.lock=false;drawOverlays()},
  pfs:function(){toggleFS()},
  's-disc':function(){T.stage('discount')},
  's-adj':function(){T.stage('adjust')},
  's-cred':function(){T.stage('credit')},
  's-sim':function(){T.sim()},
  's-net':function(){T.net()},
  's-reset':function(){T.reset();st.tab='live';st.detail=null;st.sheet=null;st.lock=false}
};
R.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t)return;var f=AC[t.dataset.a];if(f){e.preventDefault();f(t)}});
R.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.i==='q'){st.q=t.value;draw()}});

T.onRender(sync);
fit();sync();
setInterval(function(){if(!document.hidden){$('#sbar').innerHTML='<span>'+T.hm(T.now())+'</span><span>'+(S().online?'5G ':'No signal ')+'▮▮▮</span>'}},20000);
})();

</script>
